<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Chat-Accounting app icon: chat bubble + rising ledger bars -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- rounded-square background -->
  <rect x="32" y="32" width="960" height="960" rx="212" fill="url(#bg)"/>

  <!-- soft inner highlight -->
  <path d="M32 384 Q512 240 992 384 L992 244 Q992 32 780 32 L244 32 Q32 32 32 244 Z"
        fill="#ffffff" opacity="0.10"/>

  <!-- chat bubble with tail -->
  <path d="M262 226
           h500
           q96 0 96 96
           v298
           q0 96 -96 96
           h-306
           l-148 128
           q-26 22 -26 -14
           v-114
           h-20
           q-96 0 -96 -96
           v-298
           q0 -96 96 -96
           z"
        fill="#ffffff"/>

  <!-- rising ledger bars inside the bubble -->
  <rect x="352" y="486" width="88" height="150" rx="30" fill="url(#bars)"/>
  <rect x="470" y="406" width="88" height="230" rx="30" fill="url(#bars)"/>
  <rect x="588" y="316" width="88" height="320" rx="30" fill="url(#bars)"/>

</svg>
